<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Nexus Messenger Ultimate</title>
<!-- Подключаем библиотеку для проигрывания Lottie (JSON) анимаций -->
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
:root {
  --bg: #0b1118; --panel: #151f2b; --line: #243447; --text: #ffffff; --muted: #8b9eb0;
  --accent: #2d7aff; --danger: #ff4757; --success: #2ed573; --gold: #ffa502;
  --own: #2d7aff; --other: #1e2c3a;
  --grad-blue: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
  --grad-premium: linear-gradient(135deg, #FFD700, #FFA500, #FF8C00);
}
:root[data-theme=light] {
  --bg: #f0f2f5; --panel: #ffffff; --line: #e4e6eb; --text: #050505; --muted: #65676b;
  --accent: #1877f2; --own: #1877f2; --other: #e4e6eb;
}
* { box-sizing: border-box; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

@media (min-width: 768px) {
    #app { max-width: 100%; width: 100%; max-height: 100vh; border-radius: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important; }
    main { padding: 20px 40px; }
    .composer { max-width: 800px; margin: 0 auto; width: 100%; border-radius: 20px 20px 0 0; }
    .modal-content { max-width: 500px !important; }
}
@media (max-width: 767px) {
    #app { width: 100%; max-width: 450px; height: 100vh; max-height: 900px; }
}

#app { background: var(--bg); color: var(--text); position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
.view { display: none; flex: 1; flex-direction: column; min-height: 0; animation: fadeIn 0.2s ease; }
.view.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

header { display: flex; align-items: center; gap: 10px; padding: 15px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 10; }
header h2 { font-size: 18px; flex: 1; font-weight: 700; cursor: pointer; }
.ghost { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 5px; transition: 0.2s; }
.ghost:active { transform: scale(0.9); }
main { flex: 1; overflow-y: auto; padding: 15px; min-height: 0; }

input, textarea, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 12px; outline: none; transition: 0.2s; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.2); }
.btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
.btn:active { transform: scale(0.97); opacity: 0.9; }
.btn.alt { background: var(--line); color: var(--text); }
.btn.danger { background: var(--danger); }
.btn.premium { background: var(--grad-premium); color: #000; font-weight: 800; box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4); }

.row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--panel); margin-bottom: 10px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
.row:active { background: var(--line); transform: scale(0.98); }
.av { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 20px; position: relative; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.premium { border: 3px solid #FFD700; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
.av.premium::after { content: '👑'; position: absolute; top: -5px; font-size: 16px; right: -2px; transform: rotate(15deg); text-shadow: 0 0 5px #000;}
.grow { flex: 1; min-width: 0; }
.sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* АНИМИРОВАННАЯ РАМКА (Premium) */
@keyframes ringColor {
  0% { border-color: #ffd34d; box-shadow: 0 0 14px rgba(255,211,77,.7); }
  33% { border-color: #ff4757; box-shadow: 0 0 14px rgba(255,71,87,.7); }
  66% { border-color: #7b2ff7; box-shadow: 0 0 14px rgba(123,47,247,.7); }
  100% { border-color: #ffd34d; box-shadow: 0 0 14px rgba(255,211,77,.7); }
}
.av.anim, .profAv.anim { animation: ringColor 3s linear infinite; border: 3px solid #ffd34d; }
.profAv.anim { border-width: 5px; }

/* ЗНАЧКИ */
.bIcon { display: inline-block; vertical-align: middle; flex-shrink: 0; }
.bIcon svg { width: 100%; height: 100%; display: block; }

/* ЧАТ */
.msgs { display: flex; flex-direction: column; gap: 8px; padding: 15px; min-height: 100%; max-width: 800px; margin: 0 auto; width: 100%; }
.msg { max-width: 80%; background: var(--other); padding: 10px 14px; border-radius: 16px 16px 16px 4px; align-self: flex-start; word-break: break-word; font-size: 15px; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.1); animation: popIn 0.2s ease; position: relative; cursor: pointer; user-select: none; -webkit-user-select: none; }
.msg.out { background: var(--own); align-self: flex-end; border-radius: 16px 16px 4px 16px; color: #fff; }
@keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.msg .meta { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 4px; text-align: right; }
.msg .stick { font-size: 50px; line-height: 1; }
.msg img { max-width: 100%; border-radius: 10px; margin-bottom: 5px; }
.msg .from { font-size: 11px; font-weight: bold; color: var(--gold); margin-bottom: 2px; }
.msg.giftmsg { background: transparent !important; box-shadow: none !important; padding: 0 !important; }
.msg.giftmsg .meta { color: var(--muted); }
.msg.postmsg { align-self: stretch; max-width: 100%; background: var(--panel) !important; border: 1px solid var(--line); border-radius: 16px; color: var(--text); }
.stkMsgImg { width: 120px; height: 120px; object-fit: contain; border-radius: 0; margin-bottom: 0; }
.postTitle { font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.rchip { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,0.12); cursor: pointer; }
.rchip.mine { background: rgba(255,165,2,0.35); }
.reactRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rbtn { font-size: 32px; padding: 12px; border-radius: 14px; border: none; background: var(--bg); cursor: pointer; }
.views { font-size: 11px; margin-right: 8px; }
.tradeCard { background: var(--bg); border-radius: 12px; padding: 10px; margin-top: 4px; min-width: 200px; color: var(--text); text-align: left; }
.tradeBtns { display: flex; gap: 8px; margin-top: 6px; }

/* PREMIUM ПУЗЫРИ */
.bub-default { border-radius: 16px 16px 16px 4px; }
.bub-round { border-radius: 30px; }
.bub-square { border-radius: 4px; }
.bub-glass { background: rgba(255,255,255,0.1) !important; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
.bub-neon { box-shadow: 0 0 15px var(--accent), inset 0 0 10px rgba(255,255,255,0.5); border: 1px solid var(--accent); }
.bub-gradient { background: linear-gradient(45deg, #ff6b6b, #feca57) !important; color: #000 !important; font-weight: bold; }

.composer { display: flex; gap: 8px; padding: 10px 15px; background: var(--panel); border-top: 1px solid var(--line); align-items: center; z-index: 10;}
.composer input { margin: 0; border-radius: 24px; background: var(--bg); }
.composer button { border: none; border-radius: 50%; background: var(--accent); color: #fff; width: 44px; height: 44px; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: 0.2s; }
.composer button:active { transform: scale(0.9); }
.composer .icon-btn { background: none; color: var(--muted); font-size: 26px; width: 36px; }

nav { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding: 5px 0; justify-content: center; z-index: 10;}
nav button { flex: 1; max-width: 150px; padding: 10px 0; background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
nav button .ic { font-size: 22px; }
nav button.on { color: var(--accent); font-weight: bold; }

.card { background: var(--panel); border-radius: 16px; padding: 16px; margin-bottom: 15px; border: 1px solid var(--line); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item { background: var(--panel); border-radius: 16px; padding: 15px 5px; text-align: center; border: 1px solid var(--line); font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;}
.item:active { transform: scale(0.95); background: var(--line); }
.item .ic { font-size: 36px; margin-bottom: 5px; }
.price { color: var(--gold); font-weight: bold; margin-top: 5px; font-size: 12px; background: rgba(255, 165, 2, 0.1); display: inline-block; padding: 2px 8px; border-radius: 10px; }
.stockTag { font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 700; }
.evGiftTag { font-size: 10px; color: #ff9a3c; font-weight: 800; margin-top: 4px; text-transform: uppercase; }
#shopSearch { margin-bottom: 12px; }

/* СТИКЕРЫ */
.stkGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.stkItem { position: relative; background: var(--bg); border-radius: 12px; padding: 6px; text-align: center; }
.stkItem img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; display: block; }
.stkName { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stkDel { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; }

/* ВИЗУАЛ ПОДАРКОВ И NFT */
.art { width: 76px; height: 76px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 22px; overflow: hidden; }
.art svg { width: 100%; height: 100%; display: block; }
.giftbig { width: 120px; height: 120px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 26px; }
.giftbig svg { width: 100%; height: 100%; display: block; }
.emojiArt { display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 38px; }
.giftbig.emojiArt { font-size: 72px; }
.nftcard { border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.08); }
.nftcard svg { width: 84%; height: 84%; display: block; }
.craftBtn { margin-top: 5px; background: #8e44ad; border: none; padding: 5px; border-radius: 5px; color: #fff; font-size: 10px; font-weight: 700; }

.tabs { display: flex; gap: 8px; margin-bottom: 15px; background: var(--panel); padding: 5px; border-radius: 12px; overflow-x: auto;}
.tabs button { flex: 1; padding: 10px; border-radius: 8px; border: none; background: none; color: var(--muted); cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap;}
.tabs button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(45,122,255,0.3); }

/* ИВЕНТЫ */
.evBanner { margin: 0 0 12px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, #ff9a3c, #ff5e62); color: #fff; font-weight: 800; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.evPickBtn { padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--text); font-weight: 700; cursor: pointer; font-size: 14px; }
.evPickBtn.on { border-color: var(--gold); background: rgba(255,165,2,.15); }
#fxLayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5000; }
.fxp { position: absolute; top: -40px; animation-name: fxfall; animation-timing-function: linear; animation-iteration-count: infinite; user-select: none; }
@keyframes fxfall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

/* ПРОФИЛЬ */
.profBg { height: 160px; border-radius: 20px 20px 0 0; margin-bottom: -45px; transition: 0.3s; position: relative; background-size: cover; background-position: center; overflow: hidden;}
.bg-blue { background: var(--grad-blue); }

.profAv { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 5px solid var(--bg); position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 2; overflow: hidden; }
.profAv img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.profAv.premium { border-color: #FFD700; box-shadow: 0 0 20px rgba(255,215,0,0.4); }
.profAv.premium::after { content: '👑'; position: absolute; top: 0px; font-size: 24px; transform: rotate(15deg); text-shadow: 0 0 5px #000; z-index: 3;}
.badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
.logRow { font-size: 13px; padding: 10px; border-bottom: 1px solid var(--line); text-align: left; }
.logTime { font-size: 11px; color: var(--muted); }

.center { text-align: center; }
.stats { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
.stat { background: var(--panel); border-radius: 12px; padding: 10px 15px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); flex: 1; text-align: center; }
.stat b { display: block; color: var(--accent); font-size: 20px; margin-top: 5px; }

/* МОДАЛКИ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: var(--panel); border-radius: 20px; padding: 25px 20px; width: 100%; max-width: 380px; position: relative; text-align: center; border: 1px solid var(--line); max-height: 85vh; overflow-y: auto; z-index: 2001; }
.modal-close-btn { position: absolute; top: 12px; right: 12px; background: var(--line); border: none; color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; z-index: 2002; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
.modal-close-btn:hover { background: var(--danger); color: #fff; }

/* NFT ПРОСМОТР */
.nft-view-box { width: 200px; height: 200px; margin: 0 auto 15px; border-radius: 22px; display: flex; align-items: center; justify-content: center; transition: 0.3s; border: 2px solid var(--line); overflow: hidden; position: relative; background: #1c1c1e; }

.toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: bold; opacity: 0; transition: .3s; pointer-events: none; z-index: 9999; max-width: 90%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.toast.show { opacity: 1; top: 30px; }
.toast.ok { background: var(--success); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
<div class="toast" id="toast"></div>
<div id="fxLayer"></div>

<!-- ОНБОРДИНГ -->
<div class="view active" id="vOnboarding" style="background:#000;color:#fff;justify-content:center;align-items:center;text-align:center;padding:30px;">
  <div id="onboardContent" style="max-width:400px;transition:0.3s;">
    <div style="font-size:80px;margin-bottom:20px;">🔐</div>
    <h2 style="font-size:24px;margin-bottom:15px;font-weight:bold;">Полное шифрование</h2>
    <p style="color:#888;font-size:15px;line-height:1.4;">Сквозное шифрование для всех сообщений и звонков.</p>
  </div>
  <button class="btn" style="margin-top:40px;width:100%;max-width:300px;" onclick="nextOnboard()">Далее</button>
</div>

<!-- АВТОРИЗАЦИЯ -->
<div class="view" id="vAuth">
  <main style="display:flex;flex-direction:column;justify-content:center;padding:30px">
    <h1 class="center" style="font-size:28px;margin-bottom:30px;font-weight:800;color:var(--accent)">Nexus</h1>
    <input id="authNick" placeholder="Ваш ник (3-20 символов)">
    <input id="authPass" type="password" placeholder="Пароль (минимум 6)">
    <div id="authError" style="color:var(--danger);font-size:14px;text-align:center;margin-bottom:15px;font-weight:bold;display:none"></div>
    <button class="btn" id="btnLogin">Войти в аккаунт</button>
    <button class="btn alt" id="btnRegister">Создать аккаунт</button>
  </main>
</div>

<!-- СПИСОК ЧАТОВ -->
<div class="view" id="vChats">
  <header><h2>Чаты</h2></header>
  <main>
    <div style="max-width:800px;margin:0 auto;width:100%">
        <input id="searchInput" placeholder="Поиск по нику... 🔍">
        <div id="chatList"></div>
    </div>
  </main>
</div>

<!-- ЧАТ -->
<div class="view" id="vChat">
  <header>
    <button class="ghost" id="chatBack">←</button>
    <div class="av" id="chatAvatar" style="width:40px;height:40px;font-size:16px; cursor:pointer;" onclick="openFriendProfile()"></div>
    <h2 id="chatTitle" style="cursor:pointer" onclick="openFriendProfile()"></h2>
    <button class="ghost" id="btnSendGift" style="font-size:20px;">🎁</button>
  </header>
  <main id="msgsWrap" style="padding:0; position:relative;">
    <div class="msgs" id="msgs" style="position:relative;z-index:1;"></div>
  </main>
  <div class="composer">
    <input id="msgInput" placeholder="Сообщение...">
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- МАГАЗИН -->
<div class="view" id="vShop">
  <header><h2>Магазин NFT</h2></header>
  <main>
    <div style="max-width:800px;margin:0 auto;width:100%">
        <div class="card center" style="background:var(--grad-blue);color:#fff;border:none">
          <div style="font-size:14px;opacity:0.9">Баланс</div>
          <div class="balanceTxt" style="font-size:24px;font-weight:bold;color:#FFD700;margin-top:5px">0 🪙 Coin</div>
          <div class="nexTxt" style="font-size:20px;font-weight:bold;color:#00ffcc;margin-top:5px">0 NEX</div>
        </div>
        <input id="shopSearch" placeholder="Поиск NFT... 🔍">
        <div class="grid" id="shopGrid"></div>
    </div>
  </main>
</div>

<!-- ПРОФИЛЬ -->
<div class="view" id="vProfile">
  <header>
    <button class="ghost" id="profBack">←</button>
    <h2 id="profHeader">Мой профиль</h2>
  </header>
  <main style="padding-top:0">
    <div style="max-width:800px;margin:0 auto;width:100%">
        <div class="profBg bg-blue" id="profBg"></div>
        <div class="profAv" id="profAv"></div>
        <div class="center" style="margin-top:10px">
          <div style="font-size:22px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:5px" id="profNick"></div>
        </div>
        <div class="stats">
          <div class="stat">Coin<b id="profBalance">0</b></div>
          <div class="stat">NEX<b id="profNex">0</b></div>
        </div>
        <div id="profOwn">
          <div class="card" style="border-color:var(--gold)" id="premCard">
            <button class="btn premium" id="buyPremiumBtn" onclick="buyPremium()">Купить Premium (5000 NEX)</button>
          </div>
          <div class="card">
            <button class="btn danger" id="logoutBtn">Выйти из аккаунта</button>
          </div>
        </div>

        <div class="tabs" id="profTabs">
          <button id="tab_nft" class="on" onclick="setProfTab('nft')">🖼️ Мои NFT</button>
        </div>
        <div class="grid" id="invGrid"></div>
    </div>
  </main>
</div>

<!-- АДМИНКА -->
<div class="view" id="vAdmin">
  <header><h2>Админ-панель</h2></header>
  <main>
    <div style="max-width:800px;margin:0 auto;width:100%">
        <div class="card">
          <h3 style="margin-bottom:10px">💰 Валюты</h3>
          <input id="adminUser1" placeholder="Ник">
          <input id="adminAmount1" type="number" placeholder="Сумма">
          <div style="display:flex;gap:8px;">
            <button class="btn" style="background:var(--success);margin:0" onclick="adminAction('balance')">Дать Coin</button>
            <button class="btn" style="background:var(--accent);margin:0" onclick="adminAction('nex')">Дать NEX</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px">🎖️ Статусы</h3>
          <input id="adminUser2" placeholder="Ник">
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <button class="btn" style="background:var(--gold);margin:0" onclick="adminAction('premium')">Дать 👑</button>
            <button class="btn" style="background:#555;margin:0" onclick="adminAction('unpremium')">Снять 👑</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px; color: var(--danger)">🚫 Модерация</h3>
          <input id="adminUser3" placeholder="Ник">
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <button class="btn danger" style="margin:0" onclick="adminAction('ban')">Бан</button>
            <button class="btn" style="background:var(--success);margin:0" onclick="adminAction('unban')">Разбан</button>
          </div>
          <button class="btn danger" onclick="adminAction('clearNft')">УДАЛИТЬ ВСЕ NFT И ПОДАРКИ</button>
        </div>
    </div>
  </main>
</div>

<nav id="bottomNav" class="hidden">
  <button data-go="vChats" class="on"><span class="ic">💬</span>Чаты</button>
  <button data-go="vShop"><span class="ic">🛍️</span>Магазин</button>
  <button data-go="vProfile"><span class="ic">👤</span>Профиль</button>
  <button data-go="vAdmin" id="navAdmin" class="hidden"><span class="ic">🛠️</span>Админ</button>
</nav>

<!-- МОДАЛКА ПРОСМОТРА NFT -->
<div class="modal" id="mNftView">
  <div class="modal-content">
    <button class="modal-close-btn" onclick="closeModal('mNftView')">✖</button>
    <div class="nft-view-box" id="nftViewBox"></div>
    <h3 id="nftViewName" style="margin-bottom:4px">NFT</h3>
    <div id="nftRarity" style="font-size:14px;margin-bottom:12px"></div>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, get, update, onValue, onChildAdded, onChildChanged, runTransaction, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Вставьте сюда ваши конфиги Firebase
const firebaseConfig = { apiKey: "AIzaSyBkNR9ZrRFwB39CYlhk2CNz4jWD-WGWuD8", authDomain: "chat-d7385.firebaseapp.com", databaseURL: "https://chat-d7385-default-rtdb.europe-west1.firebasedatabase.app", projectId: "chat-d7385", storageBucket: "chat-d7385.firebasestorage.app", messagingSenderId: "421202112650", appId: "1:421202112650:web:7b53494f3d32fd02a87d73" };

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const ADMIN_NICK = "evdo";
const ADMIN_EMAIL = "admin@nexus.app";

const authReady = new Promise(resolve => {
  onAuthStateChanged(auth, u => {
    if (!u) { signInAnonymously(auth).catch(console.error); return; }
    resolve(u);
  });
});

const $ = id => document.getElementById(id);
const normName = s => String(s || "").trim().toLowerCase();
const toArr = v => Array.isArray(v) ? v.filter(x => x != null) : Object.values(v || {});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const userRef = name => ref(db, "users/" + name);

let me = null, profile = null, activeChat = null, chatBase = null, unsubChat = null, currentNftId = null, activeProfileTab = 'nft';

function toast(msg, ok = false) {
    const t = $("toast"); t.textContent = msg;
    t.className = "toast show" + (ok ? " ok" : "");
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove("show"), 2500);
}
function show(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    $(id).classList.add("active");
    $("bottomNav").classList.toggle("hidden", id === "vAuth" || id === "vOnboarding" || !me);
    if (id === "vChats") renderChats();
    if (id === "vShop") renderShop();
}
const openModal = id => $(id).classList.add("active");
const closeModal = id => $(id).classList.remove("active");
window.show = show; window.openModal = openModal; window.closeModal = closeModal;

/* ==========================================================
   НОВАЯ БАЗА ДАННЫХ NFT (Только рабочие ссылки)
   ========================================================== */
const FRAGMENT_BASE = "https://nft.fragment.com/gift/";

// Легендарные NFT (продаются за NEX)
const LEGENDARY_NFTS = [
  { id: "plushpepe-2133", name: "Plush Pepe", currency: "NEX", price: 5000, url: FRAGMENT_BASE + "plushpepe-2133.lottie.json" },
  { id: "hexpot-10348", name: "Hex Pot", currency: "NEX", price: 1500, url: FRAGMENT_BASE + "hexpot-10348.lottie.json" },
  { id: "astralshard-1000", name: "Astral Shard", currency: "NEX", price: 3000, url: FRAGMENT_BASE + "astralshard-1000.lottie.json" },
  { id: "prettyposy-5000", name: "Pretty Posy", currency: "NEX", price: 2000, url: FRAGMENT_BASE + "prettyposy-5000.lottie.json" },
  { id: "lushbouquet-10000", name: "Lush Bouquet", currency: "NEX", price: 2500, url: FRAGMENT_BASE + "lushbouquet-10000.lottie.json" }
];

// Обычные NFT (продаются за Coin)
const COMMON_NFTS = [
  { id: "lootbag-6207", name: "Loot Bag", currency: "Coin", price: 500, url: FRAGMENT_BASE + "lootbag-6207.lottie.json" },
  { id: "lovepotion-1000", name: "Love Potion", currency: "Coin", price: 400, url: FRAGMENT_BASE + "lovepotion-1000.lottie.json" },
  { id: "kissedfrog-1000", name: "Kissed Frog", currency: "Coin", price: 350, url: FRAGMENT_BASE + "kissedfrog-1000.lottie.json" },
  { id: "moussecake-10000", name: "Mousse Cake", currency: "Coin", price: 300, url: FRAGMENT_BASE + "moussecake-10000.lottie.json" },
  { id: "petsnake-10000", name: "Pet Snake", currency: "Coin", price: 250, url: FRAGMENT_BASE + "petsnake-10000.lottie.json" },
  { id: "bdycandle-10000", name: "B-Day Candle", currency: "Coin", price: 200, url: FRAGMENT_BASE + "bdycandle-10000.lottie.json" },
  { id: "cookiheart-1000", name: "Cookie Heart", currency: "Coin", price: 150, url: FRAGMENT_BASE + "cookiheart-1000.lottie.json" },
  { id: "jinglebells-1000", name: "Jingle Bells", currency: "Coin", price: 100, url: FRAGMENT_BASE + "jinglebells-1000.lottie.json" }
];

const ALL_NFTS = [...LEGENDARY_NFTS, ...COMMON_NFTS];

function getNftById(id) {
  return ALL_NFTS.find(n => n.id === id) || { name: "Unknown NFT", url: "" };
}

// Функция для отрисовки Lottie-плеера в карточке
function nftCardHtml(nft) {
  return `<div class="art nftcard" style="background:#1c1c1e; display:flex; justify-content:center; align-items:center;">
    <lottie-player src="${nft.url}" background="transparent" speed="1" loop autoplay style="width:80%; height:80%;"></lottie-player>
  </div>`;
}

/* ==========================================================
   АВТОРИЗАЦИЯ
   ========================================================== */
$("btnLogin").addEventListener("click", () => login(false));
$("btnRegister").addEventListener("click", () => register());

async function login(isAuto = false) {
    const name = normName($("authNick").value);
    const pass = $("authPass").value.trim();
    if (!name) return toast("Введите ник!");
    const isAdmin = name === ADMIN_NICK;

    if (isAdmin && !isAuto) {
        try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $("authPass").value); } catch (e) { return toast("Неверный пароль админа"); }
    }

    try {
        await authReady;
        const snap = await get(userRef(name));
        if (!snap.exists()) {
            if (isAdmin) {
                await set(userRef(name), { balance: 9999999, nex: 9999999, gifts: [], nfts: [], chats: [], password: "", premium: true, role: "ADMIN", createdAt: Date.now() });
            } else {
                return toast("Аккаунт не найден. Зарегистрируйтесь.");
            }
        } else {
            const data = snap.val();
            if (!isAuto && !isAdmin && data.password && data.password !== pass) return toast("Неверный пароль!");
            if (data.banned) return toast("Вы забанены!");
        }

        const currentData = (await get(userRef(name))).val();
        me = { name, role: currentData.role === "ADMIN" || isAdmin ? "ADMIN" : "USER" };

        onValue(userRef(me.name), updateProfileUI);
        show("vChats");
        toast("Вход выполнен!", true);
    } catch (e) { toast("Ошибка: " + e.message); }
}

async function register() {
    const name = normName($("authNick").value), pass = $("authPass").value.trim();
    if (name.length < 3) return toast("Ник слишком короткий");
    if (pass.length < 5) return toast("Пароль минимум 5 символов");

    try {
        await authReady;
        const res = await runTransaction(userRef(name), cur => {
            if (cur === null) {
                return { balance: 500, nex: 100, gifts: [], nfts: [], chats: [], password: pass, role: "USER", premium: false, createdAt: Date.now() };
            }
            return undefined;
        });
        if (!res.committed) return toast("Этот ник уже занят!");
        $("authPass").value = pass;
        toast("Аккаунт создан!", true);
        login(true);
    } catch (e) { toast("Ошибка: " + e.message); }
}

function updateProfileUI(snapshot) {
    profile = snapshot.val();
    if (!profile) return;
    if (!profile.nfts) profile.nfts = [];

    document.querySelectorAll(".balanceTxt").forEach(e => e.textContent = (profile.balance || 0) + " 🪙 Coin");
    document.querySelectorAll(".nexTxt").forEach(e => e.textContent = (profile.nex || 0) + " NEX");
    $("navAdmin").classList.toggle("hidden", me.role !== "ADMIN");
    
    if($("vProfile").classList.contains('active') && !viewingProfile) renderProfile(me.name);
}

/* ==========================================================
   МАГАЗИН
   ========================================================== */
let shopQuery = "";
$("shopSearch").oninput = e => { shopQuery = normName(e.target.value); renderShop(); };

function renderShop() {
    const grid = $("shopGrid"); grid.innerHTML = "";
    
    const filtered = ALL_NFTS.filter(n => !shopQuery || normName(n.name).includes(shopQuery));

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="sub center" style="grid-column:1/-1">Ничего не найдено</div>';
        return;
    }

    filtered.forEach(nft => {
        const isLegendary = nft.currency === "NEX";
        const priceColor = isLegendary ? "#00ffcc" : "var(--gold)";
        const currencyIcon = isLegendary ? "💠" : "🪙";
        
        grid.innerHTML += `<div class="item" onclick="buyNft('${nft.id}')">
            ${nftCardHtml(nft)}
            <div style="margin-top:5px;font-weight:bold;">${esc(nft.name)}</div>
            <div class="price" style="color:${priceColor}; background: rgba(255,255,255,0.05)">${currencyIcon} ${nft.price} ${nft.currency}</div>
        </div>`;
    });
}

window.buyNft = async function(id) {
    const nft = getNftById(id);
    if (!nft) return;
    
    if (profile.nfts.includes(id)) return toast("У вас уже есть этот NFT!");

    if (nft.currency === "NEX") {
        if (profile.nex < nft.price) return toast("Недостаточно NEX!");
        await update(userRef(me.name), { nex: profile.nex - nft.price, nfts: [...profile.nfts, id] });
    } else {
        if (profile.balance < nft.price) return toast("Недостаточно Coin!");
        await update(userRef(me.name), { balance: profile.balance - nft.price, nfts: [...profile.nfts, id] });
    }
    
    toast(`Куплено: ${nft.name}!`, true);
};

/* ==========================================================
   ПРОФИЛЬ И ИНВЕНТАРЬ
   ========================================================== */
window.openProfile = async function(targetName) {
    $("profHeader").textContent = targetName === me.name ? "Мой профиль" : "Профиль " + targetName;
    $("profOwn").style.display = targetName === me.name ? "block" : "none";
    show("vProfile");
    renderProfile(targetName);
};
$("profBack").onclick = () => show("vChats");
$("logoutBtn").onclick = async () => { try { await signOut(auth); } catch (e) {} location.reload(); };

async function renderProfile(targetName) {
    const snap = await get(userRef(targetName));
    if(!snap.exists()) return toast("Профиль не найден");
    const data = snap.val();

    $("profAv").textContent = targetName[0].toUpperCase();
    $("profNick").innerHTML = "@" + esc(targetName);
    $("profBalance").textContent = data.balance || 0;
    $("profNex").textContent = data.nex || 0;
    $("buyPremiumBtn").style.display = data.premium ? "none" : "flex";

    renderInventory(data);
}

window.setProfTab = (t) => {
  activeProfileTab = t;
  renderProfile(me.name);
};

function renderInventory(data) {
    const grid = $("invGrid");
    grid.innerHTML = "";
    const nfts = toArr(data.nfts);

    if (nfts.length === 0) {
        return grid.innerHTML = '<div class="sub center" style="grid-column:1/-1">У вас пока нет NFT</div>';
    }

    nfts.forEach(nftId => {
        const nft = getNftById(nftId);
        grid.innerHTML += `<div class="item" onclick="openNftView('${nftId}')">
            ${nftCardHtml(nft)}
            <div style="margin-top:5px">${esc(nft.name)}</div>
        </div>`;
    });
}

window.openNftView = function(nftId) {
    currentNftId = nftId;
    const nft = getNftById(nftId);
    
    $("nftViewBox").innerHTML = `<lottie-player src="${nft.url}" background="transparent" speed="1" loop autoplay style="width:100%; height:100%;"></lottie-player>`;
    $("nftViewName").textContent = nft.name;
    $("nftRarity").textContent = nft.currency === "NEX" ? "Легендарный" : "Обычный";
    
    openModal("mNftView");
};

/* ==========================================================
   ЧАТЫ (Базовый функционал)
   ========================================================== */
async function renderChats(filter = "") {
    const list = $("chatList"); list.innerHTML = "";
    if(!profile || !profile.chats) return;
    const chats = toArr(profile.chats).sort((a, b) => (b.time || 0) - (a.time || 0));

    for (const c of chats) {
        if(filter && !c.name.includes(filter)) continue;
        const el = document.createElement("div"); el.className = "row";
        el.innerHTML = `
        <div class="av">${c.name[0].toUpperCase()}</div>
        <div class="grow">
            <div style="font-weight:bold;">${esc(c.name)}</div>
            <div class="sub">${esc(c.last || 'Нажмите чтобы открыть')}</div>
        </div>`;
        el.onclick = () => openChat(c.name);
        list.appendChild(el);
    }
}

let searchTimer;
$("searchInput").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 250); };
async function doSearch() {
    const q = normName($("searchInput").value);
    if (!q) return renderChats();
    const list = $("chatList");
    list.innerHTML = "";
    const snap = await get(ref(db, "users"));
    if (snap.exists()) {
        const users = snap.val();
        Object.keys(users).filter(n => n.includes(q) && n !== me.name).forEach(n => {
            const el = document.createElement("div"); el.className = "row";
            el.innerHTML = `<div class="av">${n[0].toUpperCase()}</div><div class="grow"><div style="font-weight:bold;">${esc(n)}</div><div class="sub">Пользователь</div></div>`;
            el.onclick = () => openChat(n);
            list.appendChild(el);
        });
    }
}

async function openChat(target) {
    activeChat = target;
    $("chatTitle").textContent = target;
    $("chatAvatar").textContent = target[0].toUpperCase();
    $("msgs").innerHTML = "";
    show("vChat");

    let chats = toArr(profile.chats);
    if (!chats.find(c => c.name === target)) {
        chats.push({ name: target, time: Date.now() });
        await update(userRef(me.name), { chats });
    }

    if (unsubChat) unsubChat();
    chatBase = "chats/" + [me.name, target].sort().join("_");
    const path = ref(db, chatBase);

    unsubChat = onChildAdded(path, snap => {
        const m = snap.val();
        if (!m) return;
        const div = document.createElement("div");
        div.className = "msg " + (m.from === me.name ? "out" : "");
        div.innerHTML = `${m.type === 'nft' ? nftCardHtml(getNftById(m.text)) : esc(m.text)}<div class="meta">${new Date(m.time).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"})}</div>`;
        $("msgs").appendChild(div);
        $("msgsWrap").scrollTop = $("msgsWrap").scrollHeight;
    });
}

$("chatBack").onclick = () => { if (unsubChat) { unsubChat(); unsubChat = null; } activeChat = null; chatBase = null; show("vChats"); };

async function sendMessage(text, type = 'text') {
    if (!activeChat) return;
    const base = "chats/" + [me.name, activeChat].sort().join("_");
    await push(ref(db, base), { from: me.name, text, type, time: Date.now() });
}
$("sendBtn").onclick = () => { const input = $("msgInput"); const text = input.value.trim(); if (!text) return; input.value = ""; sendMessage(text); };
$("msgInput").onkeydown = e => { if (e.key === "Enter") $("sendBtn").click(); };

/* ==========================================================
   АДМИНКА
   ========================================================== */
window.adminAction = async function(action) {
    if (me.role !== "ADMIN") return;

    let fieldId = 'adminUser3';
    if (['balance', 'nex'].includes(action)) fieldId = 'adminUser1';
    if (['premium', 'unpremium'].includes(action)) fieldId = 'adminUser2';

    const user = normName($(fieldId).value);
    if (!user) return toast("Введите ник");
    const snap = await get(userRef(user));
    if (!snap.exists()) return toast("Пользователь не найден");

    let updates = {};
    if (action === 'balance' || action === 'nex') {
        const amount = Number($("adminAmount1").value);
        if (!amount) return toast("Введите сумму");
        updates[action] = (snap.val()[action] || 0) + amount;
    } else if (action === 'ban') updates.banned = true;
    else if (action === 'unban') updates.banned = false;
    else if (action === 'premium') updates.premium = true;
    else if (action === 'unpremium') updates.premium = false;
    else if (action === 'clearNft') { 
        updates.nfts = []; 
        updates.gifts = []; 
    }

    await update(userRef(user), updates);
    toast("Действие выполнено!", true);
};

/* НАВИГАЦИЯ */
document.querySelectorAll("#bottomNav button[data-go]").forEach(b => {
  b.onclick = () => {
    const v = b.dataset.go;
    document.querySelectorAll("#bottomNav button").forEach(x => x.classList.toggle('on', x === b));
    if (v === "vChats") show("vChats");
    if (v === "vShop") show("vShop");
    if (v === "vProfile") openProfile(me.name);
    if (v === "vAdmin") show("vAdmin");
  };
});

</script>
</body>
</html>
